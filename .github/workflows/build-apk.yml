name: Build SIM Maps APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NDK and CMake (use preinstalled SDK)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_HOME || ls /usr/local/lib/android/sdk
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          sdkmanager --install "ndk;29.0.14206865" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0" || true
          yes | sdkmanager --licenses || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/29.0.14206865" >> android/local.properties
          cat android/local.properties
          ls $ANDROID_HOME/ndk/ || true

      - name: Build SIM Maps APK Web Debug arm64
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleWebDebug -Parm64 --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SIM-Maps-APK-Geandre-v47
          path: |
            android/app/build/outputs/apk/**/*.apk
