name: Build SIM Maps APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Patch build.gradle bypass bash 127
        run: |
          cd ${{ github.workspace }}
          sed -n '1,50p' android/build.gradle
          python3 /tmp/patch.py || true
          # Also fix permissions
          chmod +x tools/* 2>/dev/null || true
          chmod +x ../tools/* 2>/dev/null || true
          chmod +x android/gradlew
          ls -la tools/ | head -20 || true

      - name: Install NDK
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/29.0.14206865" >> android/local.properties
          sdkmanager --install "ndk;29.0.14206865" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Build Web Debug
        run: |
          cd android
          ./gradlew assembleWebDebug -Parm64 --stacktrace --info 2>&1 | head -n 200
          ./gradlew assembleWebDebug -Parm64 --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SIM-Maps-APK-Geandre-v49-PATCHED
          path: android/app/build/outputs/apk/**/*.apk
