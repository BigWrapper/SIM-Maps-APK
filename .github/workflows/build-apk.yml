name: Build SIM Maps APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: my
      - name: Clone base
        run: git clone --recursive https://github.com/organicmaps/organicmaps.git base
      - name: Replace android folder
        run: rm -rf base/android && cp -r my/android base/ && ls base/android
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build
        run: |
          cd base/android
          chmod +x gradlew
         ./gradlew assembleWebDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SIM-Maps-APK
          path: base/android/app/build/outputs/apk/web/debug/*.apk
