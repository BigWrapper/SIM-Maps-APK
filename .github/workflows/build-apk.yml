name: Build SIM Maps APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone base OrganicMaps
        run: git clone --depth 1 https://github.com/organicmaps/organicmaps.git base --recurse-submodules
      - name: Checkout your android
        uses: actions/checkout@v4
        with: {path: my}
      - name: Replace android folder
        run: rm -rf base/android && cp -r my/android base/android
      - uses: actions/setup-java@v4
        with: {java-version: 17, distribution: temurin}
      - uses: android-actions/setup-android@v3
      - run: cd base/android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: SIM-Maps-APK, path: base/android/build/outputs/apk/debug/*.apk}
