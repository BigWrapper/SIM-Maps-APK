name: Build SIM Maps APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: my
      - name: Clone base
        run: |
          git clone --recursive https://github.com/organicmaps/organicmaps.git base
          rm -rf base/.git
      - name: Replace android
        run: |
          rm -rf base/android
          cp -r my/android base/android
          ls base/android
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android
        uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          cd base/android
          chmod +x gradlew
         ./gradlew assembleWebDebug --stacktrace
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SIM-Maps-APK
          path: base/android/app/build/outputs/apk/**/*.apk
