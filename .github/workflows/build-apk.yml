name: Build SIM Maps APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;29.0.14206865" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"
          echo "ndk.dir=$ANDROID_HOME/ndk/29.0.14206865" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          cat android/local.properties

      - name: Build SIM Maps APK (Web Debug - arm64)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleWebDebug -Parm64 --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SIM-Maps-APK-Geandre-v46-FULL-BUILD
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/apk/web/debug/*.apk
