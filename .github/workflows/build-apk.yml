name: Build SIM Maps APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: FIX both errors correctly
        run: |
          echo "=== Revert previous bad patch ==="
          git checkout -- android/settings.gradle android/build.gradle || true
          
          python3 << 'PY'
          import pathlib
          # FIX 1: settings.gradle - Add pluginManagement for nmcp and allowDuplicate
          p = pathlib.Path("android/settings.gradle")
          text = p.read_text()
          
          # Add pluginManagement with nmcp if not present
          if "com.gradleup.nmcp" not in text:
              # Insert at top
              plugin_block = '''pluginManagement {
            plugins {
              id "com.gradleup.nmcp" version "0.0.8"
            }
            repositories {
              gradlePluginPortal()
              google()
              mavenCentral()
            }
          }
          '''
              text = plugin_block + "\n" + text
          
          # Add nmcp config at bottom if not present
          if "allowDuplicateProjectNames" not in text:
              text += '''
          // Fix for Gradle 8.7+ duplicate project names check - Geandre v54
          plugins.withId("com.gradleup.nmcp") {
            nmcp {
              allowDuplicateProjectNames.set(true)
            }
          }
          '''
          
          p.write_text(text)
          print("Fixed settings.gradle")
          print(text[-800:])
          
          # FIX 2: build.gradle - bash 127 - hardcode version
          p2 = pathlib.Path("android/build.gradle")
          t = p2.read_text()
          # Replace bash with sh and git calls
          t = t.replace("'bash'", "'sh'").replace('"bash"', '"sh"')
          t = t.replace("git rev-list --count HEAD", "echo 1")
          t = t.replace("git rev-parse", "echo abc")
          t = t.replace("git describe", "echo v1")
          p2.write_text(t)
          print("Fixed build.gradle bash")
          PY
          
          echo "=== Patched settings.gradle ==="
          cat android/settings.gradle | tail -n 50
          echo "=== Patched build.gradle lines 1-50 ==="
          sed -n '1,50p' android/build.gradle

      - name: Setup SDK NDK
        run: |
          export ANDROID_HOME=$ANDROID_HOME
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;29.0.14206865" "cmake;3.22.1" || true
          yes | sdkmanager --licenses || true
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/29.0.14206865" >> android/local.properties

      - name: Build Web Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleWebDebug -Parm64 --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SIM-Maps-APK-Geandre-v54
          path: android/app/build/outputs/apk/**/*.apk
