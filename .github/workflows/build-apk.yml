name: Build SIM Maps APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --info | tail -n 150
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SIM-Maps-APK-Geandre-v45
          path: android/app/build/outputs/apk/debug/*.apk
